name: Validate and Generate

on:
  pull_request:
    paths:
      - 'data/curated.yml'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'data/curated.yml'
      - 'scripts/**'

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate curated list
        run: npm run validate

      - name: Generate READMEs
        run: npm run generate

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Generated files differ from committed versions"
            echo "Please run 'npm test' locally and commit the generated files"
            git diff
            exit 1
          else
            echo "✅ All generated files are up to date"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Validation or generation failed. Please run `npm test` locally and commit the generated files.'
            })
