name: Validate and Generate

on:
  pull_request:
    paths:
      - 'data/curated.yml'
      - 'data/marketplace-cache.json'
      - 'README*.md'
      - 'package*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'data/curated.yml'
      - 'data/marketplace-cache.json'
      - 'README*.md'
      - 'package*.json'
      - 'scripts/**'

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Validate the committed snapshot; live stars/counts must not cause drift.
      MARKETPLACE_OFFLINE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate curated list
        run: npm test

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Generated files differ from committed versions"
            echo "Please run 'npm test' locally and commit the generated files"
            git diff
            exit 1
          else
            echo "✅ All generated files are up to date"
          fi
