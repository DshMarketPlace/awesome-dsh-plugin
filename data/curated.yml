# Curated DSH Plugins
# This file contains the selection of plugins to be featured in the Awesome list
# Metadata is fetched from DSH Marketplace API

# Starter Pack - repos to highlight as "essential"
# These should also appear in categories below
starter:
  - ZASENJC/dsh-plugins-store
  - omdsh-dev/DSH-better-sidebar
  - Anionex/dsh-vision-toolkit
  - tinqiao-oss/engramory
  - dsh-market/dsh-market
  - NanmiCoder/dsh-agent-teams
  - superdesigndev/treg
  - Alisa0808/vox-director
  - liustack/modlens
  - sandbaseai/sandbase-harness

# Categorized plugins
categories:
  - name: UI & Experience
    slug: ui
    plugins:
      - repo: omdsh-dev/DSH-better-sidebar
      - repo: ccch1mneyyy/dsh-TUI
      - repo: omdsh-dev/dsh-at-file
      - repo: huiliyi37/dsh-tianshu-tui
      - repo: Nagi-ovo/dsh-visualize
      - repo: zhu1090093659/dsh-web-ui
        subpath: packages/dsh-web-ui-all

  - name: Models & Providers
    slug: model
    plugins:
      - repo: sandbaseai/sandbase-harness
      - repo: NanmiCoder/dsh-auto-mode
      - repo: anysearch-team/anysearch-dsh
      - repo: HanaAyane/dsh-reasoning-effort
      - repo: AITabby/dockyard-dsh

  - name: Memory
    slug: memory
    plugins:
      - repo: tinqiao-oss/engramory
      - repo: csyangwen/dsh-memory-evolve
      - repo: bowenliang123/dsh-context
      - repo: volcengine/OpenViking
